# Runs lint, type checks and the full test suite on every push and pull
# request, across supported Python versions, with and without NumPy.
# Python 3.9 is still supported by the code (verified locally) but is no
# longer available on GitHub's current Ubuntu runners, so CI starts at 3.10.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy: [false, true]  # true also installs pandas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: pip install ruff mypy
      - name: Install NumPy and pandas (optional dependencies)
        if: matrix.numpy
        run: pip install numpy pandas
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (unit, doctests, stress, fuzz)
        run: python -m unittest -v
